<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPSS ANOVA Exam Sets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky tab bar; Learn = one concept per screen (visual first, 7 tap-open chips); sets = stacked question cards */
:root{
  --bg:#f7f1e8; --paper:#fffcf7; --ink:#3d332a; --muted:#7a6c5e; --line:#e7ddcf; --soft:#f4ece1;
  --accent:#8a6a50; --accent-soft:#f0e5d6; --hi:#f9e2b3; --hi-line:#d6a85e;
  --good:#5e7c4f; --good-soft:#e9efe1; --bad:#ad5a43; --bad-soft:#f6e4dc; --warn:#8a6524; --warn-soft:#fbf1df;
  --spss-head:#efe6d9;
  --sage:#5f7f62; --sage-soft:#e6eee2; --lilac:#7a6496; --lilac-soft:#eee8f5;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:20px 14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4vw,2.2rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.count{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 .95rem var(--f-body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--hi-line);outline-offset:2px}
main .wrap{padding-block:22px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0}
.lead{color:var(--muted);max-width:66ch;margin:0 0 16px}

/* ---------- learn ---------- */
.cnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.cnav button{flex:0 0 auto;font:600 .82rem var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer}
.cnav button.on{background:var(--sage);border-color:var(--sage);color:#fff}
.cnav .grp{flex:0 0 auto;font:600 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);align-self:center;padding:0 2px 0 8px}
.screen{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,30px)}
.eyebrow{font:600 .75rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lilac)}
.hook{font-family:var(--f-display);font-weight:500;font-size:clamp(1.1rem,2.6vw,1.4rem);line-height:1.35;margin:10px 0 18px;padding:12px 16px;background:var(--sage-soft);border-left:4px solid var(--sage);border-radius:10px;max-width:60ch}
.menu{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 16px}
.menu span{font:500 .85rem var(--f-mono);background:var(--lilac-soft);border:1px solid #ddd2ea;border-radius:6px;padding:4px 9px}
.menu i{color:var(--muted);font-style:normal}
.spss{overflow-x:auto;margin:0 0 6px}
.spss .cap{font:700 .9rem var(--f-body);margin:0 0 4px}
.spss table{border-collapse:collapse;font:400 .88rem var(--f-body);font-variant-numeric:tabular-nums;background:var(--paper)}
.spss th,.spss td{border:1px solid var(--line);padding:5px 10px;text-align:right;white-space:nowrap}
.spss th{background:var(--spss-head);font-weight:600;text-align:center}
.spss td:first-child,.spss th:first-child{text-align:left}
.spss td.hi{background:var(--hi);outline:2px solid var(--hi-line);outline-offset:-2px;font-weight:700;position:relative}
.readhere{font:600 .78rem var(--f-mono);color:var(--warn);margin:4px 0 18px}
.readhere::before{content:"▲ "}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .9rem var(--f-body);border:1.5px solid var(--accent);color:var(--accent);background:var(--paper);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-expanded="true"]{background:var(--accent);color:#fff}
.chip.alt{border-color:var(--line);color:var(--ink)}
.chip.alt[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip b{font-family:var(--f-mono);margin-right:4px}
.panel{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--soft);border:1px solid var(--line);max-width:72ch}
.panel p{margin:0 0 8px}.panel p:last-child{margin-bottom:0}
.panel ol,.panel ul{margin:0;padding-left:1.3em}.panel li{margin:3px 0}
.wording{display:grid;gap:8px}
.wording div{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 10px;background:var(--paper);border-radius:8px;border:1px solid var(--line)}
.wording q{font-style:italic;quotes:"“" "”"}
.wording span{color:var(--accent);font-weight:600}
.calc{font-family:var(--f-mono);font-size:.88rem;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto}
.friend{margin-top:10px;padding:8px 12px;border-left:3px solid var(--hi-line);background:var(--warn-soft);border-radius:0 8px 8px 0}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pn button{font:600 .9rem var(--f-body);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;color:var(--ink)}
/* triage */
.fork{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:14px 0 20px}
.branch{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.branch h3{margin-bottom:8px}
.flow{display:grid;gap:6px}
.flow a{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:8px;background:var(--soft);border:1px solid transparent}
.flow a:hover{border-color:var(--accent)}
.flow a small{display:block;color:var(--muted)}
.flow a b{font:600 .8rem var(--f-mono);color:var(--lilac);text-align:right}
.tri{width:100%;border-collapse:collapse;font-size:.92rem}
.tri th{text-align:left;font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
.tri td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tri td:nth-child(2){font-weight:700;color:var(--sage)}
.tri td:nth-child(3){font-family:var(--f-mono);font-size:.8rem}
.scrollx{overflow-x:auto}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.map ol{margin:0;padding-left:2.1em}.map li{margin:4px 0}
.map li button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.traps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.traps li{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.traps .no{color:var(--bad);font-weight:600}.traps .yes{color:var(--good);font-weight:600}

/* ---------- sets ---------- */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.seg button{font:600 .88rem var(--f-body);border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--lilac);color:#fff;border-color:var(--lilac)}
.seg button .done{font:600 .72rem var(--f-mono);margin-left:6px;color:var(--good)}
.seg button.on .done{color:#bff0d0}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.file{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.file small{display:block;font:600 .72rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.file{background:var(--sage-soft)!important;border-color:#d3e0cd!important}
.file code{font:600 .9rem var(--f-mono);color:var(--sage);word-break:break-all}
.part{margin:26px 0 10px}
.part .story{color:var(--muted);max-width:72ch;margin:4px 0 0}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;display:grid;gap:10px}
.q.ok{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qn{font:700 .95rem var(--f-mono);color:var(--paper);background:var(--lilac);border-radius:6px;padding:1px 8px}
.dec{font:500 .78rem var(--f-mono);color:var(--muted)}
.orig{font-size:.86rem;color:var(--muted);margin:0;font-style:italic}
.orig::before{content:"Model wording: ";font-style:normal;font-weight:600}
.qt{margin:0;max-width:75ch}
.ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans input{font:500 1rem var(--f-mono);width:9.5rem;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.ans button{font:600 .9rem var(--f-body);padding:8px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.fb{font-size:.92rem;font-weight:600}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}.fb.warn{color:var(--warn)}
.sol .big{font:700 1.3rem var(--f-mono);color:var(--good);margin-bottom:6px}
.sol h4{font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.sol ol li{font-size:.92rem}
.sym{display:grid;gap:6px}
.sym div{display:grid;grid-template-columns:7.5rem 1fr;gap:8px;font-size:.92rem}
.sym div span:first-child{font:600 .72rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.tools button{font:600 .82rem var(--f-body);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);max-width:75ch}
@media (max-width:520px){.sym div{grid-template-columns:1fr}.ans input{width:100%}}
@media (prefers-reduced-motion:no-preference){.panel{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}}
.file{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.dl{font:600 .85rem var(--f-body);border:0;border-radius:8px;padding:7px 12px;background:var(--sage);color:#fff;cursor:pointer}
.dl:hover{filter:brightness(1.08)}
.dlall{margin:0 0 18px}

.setnav{display:flex;gap:8px;margin:0 0 18px}
.setnav button{font:600 .95rem var(--f-body);border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 16px;cursor:pointer;color:var(--ink)}
.setnav button.on{background:var(--lilac);border-color:var(--lilac);color:#fff}
.q.open .qn{background:var(--sage)}
.ans textarea{font:400 .95rem var(--f-body);width:min(100%,560px);min-height:70px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1>SPSS ANOVA · Exam Sets</h1><p class="sub">3 sets × 15 questions · exam wording, no hints in the questions</p></div>
  <div class="count" id="progress"></div>
</div></header>
<main><div class="wrap">
  <p class="lead">Questions are worded like the exam: they do not tell you which analysis to run. Download the data, answer in SPSS and press Check. Only then can you open a Hint or the answer with the SPSS steps.</p>
  <div class="setnav" id="setnav"></div>
  <div id="exam"></div>
</div></main>
